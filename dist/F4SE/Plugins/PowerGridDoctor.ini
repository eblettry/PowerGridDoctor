[General]
; 0 = report only (default, never changes anything)
; 1 = remove every reference to a missing/deleted object from the power grids
;     and from ExtraPowerLinks, then re-check. Make a backup save first!
bFix=0

; 0 = only dump workshops that have problems (one summary line for the rest)
; 1 = dump every workshop's grids in full
bDumpAll=0

; 1 = also scan when the workshop menu opens (grids of loaded settlements are
;     fully built at that point; right after loading a save they may not be)
bScanOnWorkshopMenu=1
