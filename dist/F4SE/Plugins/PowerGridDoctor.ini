[General]
; Normal way to repair: F4SE Menu Framework > Power Grid Doctor > Settlements,
; then the Repair button next to the settlement. That repairs one settlement only.
;
; bFix is the blunt alternative for people without F4SE Menu Framework:
; 0 = report only (default, never changes anything)
; 1 = repair EVERY settlement with problems, on every load and every time the
;     workshop menu opens. Make a backup save first, and set it back to 0 after.
bFix=0

; 0 = short log: one line per healthy settlement, and only the details of each
;     problem (where it's referenced and which objects hold it). Repeated scans
;     don't write the same problems again. Small enough for pastebin.
; 1 = write every settlement's full power grid (very long, for debugging)
bDumpAll=0

; 1 = also scan when the workshop menu opens (grids of loaded settlements are
;     fully built at that point; right after loading a save they may not be)
bScanOnWorkshopMenu=1
